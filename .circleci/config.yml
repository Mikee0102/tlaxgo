version: 2.1

orbs:
  node: circleci/node@5.1.0
  slack: circleci/slack@4.12.5

jobs:
  build:
    docker:
      - image: cimg/node:20.17.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Construir la aplicación web
          command: pnpm run build
      - slack/notify:
          event: fail
          channel: "C0CCMK8GG8H"
          template: basic_fail_1

  playwright_tests:
    docker:
      # Imagen oficial con Node 20, Chromium y dependencias del sistema ya instaladas
      - image: mcr.microsoft.com/playwright:v1.49.0-noble
    steps:
      - checkout
      - run:
          name: Instalar dependencias con pnpm
          command: |
            corepack enable
            pnpm install --frozen-lockfile
      - run:
          name: Ejecutar pruebas E2E con Playwright
          command: pnpm test:e2e
      - store_artifacts:
          path: playwright-report
          destination: reporte-playwright
      - slack/notify:
          event: fail
          channel: "C0CCMK8GG8H"
          template: basic_fail_1
      - slack/notify:
          event: pass
          channel: "C0CCMK8GG8H"
          template: basic_success_1

workflows:
  flujo_de_integracion:
    jobs:
      - build:
          context: slack-secrets
      - playwright_tests:
          context: slack-secrets