version: 2.1

# Los Orbs son paquetes de CircleCI que facilitan integraciones
orbs:
  node: circleci/node@5.1.0
  slack: circleci/slack@4.12.5

jobs:
  build_and_test:
    docker:
      # Utilizamos un contenedor con la versión de Node.js 20.17
      - image: cimg/node:20.17.0 
    steps:
      - checkout # Clona el código de GitHub
      
      # Instala las dependencias (npm install)
      - node/install-packages 
      
      # Construye la aplicación Next.js
      - run:
          name: Construir la aplicación web
          command: npm run build 
          
      # Ejecuta las pruebas End-to-End
      - run:
          name: Pruebas automatizadas con Cypress
          command: npx cypress run 
          
      # Notificación FORZOSA a Slack si el proceso FALLA
      - slack/notify:
          event: fail
          channel: "tu-canal-de-slack" # Reemplaza con el nombre de tu canal
          template: basic_fail_1
          
      # Notificación FORZOSA a Slack si el proceso es EXITOSO
      - slack/notify:
          event: pass
          channel: "tu-canal-de-slack" 
          template: basic_success_1

workflows:
  flujo_de_integracion:
    jobs:
      - build_and_test